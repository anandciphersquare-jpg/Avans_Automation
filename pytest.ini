[pytest]
; one report page per run: reports/Test_Report_<run_id>.html (reporting/ plugin)
addopts = -ra -q --strict-markers
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    smoke: minimal critical-path checks
    functional: functional behaviour
    positive: happy-path / positive cases
    negative: invalid-input / negative cases
    boundary: boundary and validation-rule cases
    security: security checks (masking, injection, headers, lockdown)
    authorization: role / permission / maker-checker / hierarchy
    api: API-level tests (no browser)
    ui: UI / rendering
    auth: authentication, OTP, session
    regression: full regression set

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="reporting.plugin">
<title>{{TITLE}}</title>
<style>/*{{CSS}}*/</style>
</head>
<body>
<!-- icon sprite: every status is shown as icon + label, never colour alone -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-PASS" viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-FAIL" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-BLOCKED" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4.2 11.8l7.6-7.6" stroke="currentColor" stroke-width="1.8"/></symbol>
  <symbol id="i-SKIPPED" viewBox="0 0 16 16"><path d="M3 4l5 4-5 4zM8.5 4l5 4-5 4z" fill="currentColor"/></symbol>
  <symbol id="i-chev" viewBox="0 0 16 16"><path d="M6 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-sun" viewBox="0 0 16 16"><circle cx="8" cy="8" r="3" fill="currentColor"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6L13 13M3 13l1.4-1.4M11.6 4.4L13 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
  <symbol id="i-moon" viewBox="0 0 16 16"><path d="M13.5 10.2A6 6 0 015.8 2.5a6 6 0 107.7 7.7z" fill="currentColor"/></symbol>
  <symbol id="i-download" viewBox="0 0 16 16"><path d="M8 2v8M4.5 6.5L8 10l3.5-3.5M3 13h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-camera" viewBox="0 0 16 16"><path d="M2 5h2.5l1-1.5h5L11.5 5H14v8H2z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="8" cy="9" r="2.2" fill="none" stroke="currentColor" stroke-width="1.4"/></symbol>
  <symbol id="i-retry" viewBox="0 0 16 16"><path d="M13 8a5 5 0 11-1.5-3.6M13 2.5V5h-2.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-logo" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="6" fill="currentColor"/><path d="M7 12.5l3 3 7-7.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<header class="topbar">
  <div class="brand">
    <svg class="logo"><use href="#i-logo"/></svg>
    <div class="brand-text">
      <h1 id="title"></h1>
      <div class="subtitle" id="subtitle"></div>
    </div>
  </div>
  <div class="top-actions">
    <div class="menu" id="exportMenu">
      <button class="btn" id="exportBtn" aria-haspopup="true" aria-expanded="false">
        <svg class="ic"><use href="#i-download"/></svg> Export
      </button>
      <div class="menu-list" role="menu" hidden>
        <button role="menuitem" data-export="pdf">PDF <small>dashboard + filtered tests</small></button>
        <button role="menuitem" data-export="html">HTML <small>this report, standalone</small></button>
        <button role="menuitem" data-export="csv">CSV <small>filtered tests</small></button>
        <button role="menuitem" data-export="json">JSON <small>all results</small></button>
      </div>
    </div>
    <button class="btn icon-btn" id="themeBtn" aria-label="Switch colour theme" title="Switch colour theme">
      <svg class="ic"><use href="#i-moon"/></svg>
    </button>
  </div>
</header>

<nav class="subnav" aria-label="Report sections">
  <a href="#dashboard">Dashboard</a>
  <a href="#failures">Failures <span class="count" id="navFailures"></span></a>
  <a href="#retries">Retries <span class="count" id="navRetries"></span></a>
  <a href="#tests">Test cases <span class="count" id="navTests"></span></a>
</nav>

<main>
  <section id="dashboard" class="section">
    <div class="kpis" id="kpis"></div>
    <dl class="meta-grid card" id="meta"></dl>
    <div class="charts">
      <figure class="card chart-card">
        <figcaption><h3>Result distribution</h3><span class="hint">Click a slice to filter</span></figcaption>
        <div id="chartStatus" class="chart"></div>
      </figure>
      <figure class="card chart-card span-2">
        <figcaption><h3>Results by module</h3><span class="hint">Click a module to filter</span></figcaption>
        <div id="chartModules" class="chart"></div>
      </figure>
      <figure class="card chart-card">
        <figcaption><h3>Issue types</h3><span class="hint">Failed + blocked tests</span></figcaption>
        <div id="chartCategories" class="chart"></div>
      </figure>
      <figure class="card chart-card span-2">
        <figcaption><h3>Pass-rate trend</h3><span class="hint" id="trendHint"></span></figcaption>
        <div id="chartTrend" class="chart"></div>
      </figure>
    </div>
  </section>

  <section id="failures" class="section">
    <div class="section-head"><h2>Failure summary</h2><span class="muted" id="failureCaption"></span></div>
    <div id="failureSummary"></div>
  </section>

  <section id="retries" class="section">
    <div class="section-head"><h2>Retry analysis</h2><span class="muted" id="retryCaption"></span></div>
    <div id="retryAnalysis"></div>
  </section>

  <section id="tests" class="section">
    <div class="section-head"><h2>Test cases</h2><span class="muted" id="resultCount" aria-live="polite"></span></div>
    <div class="toolbar card">
      <label class="search">
        <svg class="ic"><use href="#i-search"/></svg>
        <input id="search" type="search" placeholder="Search ID, name, module, feature, error…" autocomplete="off">
      </label>
      <div class="chips" id="statusChips" role="group" aria-label="Filter by status"></div>
      <div class="selects">
        <select id="moduleFilter" aria-label="Filter by module"><option value="">All modules</option></select>
        <select id="typeFilter" aria-label="Filter by test type"><option value="">All types</option></select>
        <select id="sortBy" aria-label="Sort">
          <option value="default">Sort: module order</option>
          <option value="status">Sort: failures first</option>
          <option value="duration">Sort: slowest first</option>
          <option value="name">Sort: name</option>
          <option value="id">Sort: test ID</option>
          <option value="start">Sort: start time</option>
        </select>
      </div>
      <div class="toggles">
        <label class="check"><input type="checkbox" id="groupToggle" checked> Group by module</label>
        <label class="check"><input type="checkbox" id="retriedOnly"> Retried only</label>
        <button class="btn ghost" id="expandAll">Expand all</button>
        <button class="btn ghost" id="collapseAll">Collapse all</button>
        <button class="btn ghost" id="resetFilters">Reset</button>
      </div>
    </div>
    <div id="testList"></div>
  </section>
</main>

<footer class="footer" id="footer"></footer>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Screenshot preview" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-body">
    <div class="modal-head">
      <span id="modalCaption"></span>
      <div>
        <a class="btn ghost" id="modalOpen" target="_blank" rel="noopener">Open original</a>
        <button class="btn ghost" id="modalClose" data-close aria-label="Close">Close (Esc)</button>
      </div>
    </div>
    <div class="modal-stage">
      <button class="nav prev" id="modalPrev" aria-label="Previous screenshot">‹</button>
      <img id="modalImg" alt="">
      <button class="nav next" id="modalNext" aria-label="Next screenshot">›</button>
    </div>
  </div>
</div>

<div class="tooltip" id="tooltip" role="tooltip" hidden></div>

<script id="report-data" type="application/json">{{DATA}}</script>
<script>/*{{JS}}*/</script>
</body>
</html>
